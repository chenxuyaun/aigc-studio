x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${FRONTEND_PORT:-5000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

    logging: *default-logging
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    entrypoint: ["bash", "/docker-entrypoint.sh"]
    ports:
      - "${API_INTERNAL_PORT:-8002}:8000"
    env_file: .env
    # 容器内以 mysql 服务名访问；本地 uvicorn（无 DATABASE_URL）仍走 SQLite
    environment:
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-aigc}:${MYSQL_PASSWORD:-changeme}@mysql:3306/${MYSQL_DATABASE:-aigc_studio}
    # 让容器内 provider 的 host.docker.internal 能指向宿主机（grok2api/cpa 跑在宿主机 docker）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging: *default-logging
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app:celery_app",
        "worker",
        "-B",
        "-l",
        "info",
        "-Q",
        "text,image,video,audio,import,maintenance",
      ]
    env_file: .env
    environment:
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-aigc}:${MYSQL_PASSWORD:-changeme}@mysql:3306/${MYSQL_DATABASE:-aigc_studio}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
      - ./backups:/app/backups
    restart: unless-stopped

    logging: *default-logging
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aigc_studio}
      MYSQL_USER: ${MYSQL_USER:-aigc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

    logging: *default-logging
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

    logging: *default-logging
volumes:
  mysql_data:
  redis_data:
  storage_data:
