# ============ 四、职业失真（4） ============

- id: GC-16
  title: 医生违反医疗流程且无解释
  category: 职业失真
  kind: detector
  input: "他看了病人一眼，没做检查就直接下了手术决定。"
  expect:
    verdict: FAIL
    failure_type: TIMELINE_CONFLICT
  note: 职业流程失真（WCI 类）。failure_type 由 LLM critic 判定，此处为确定性代理。

- id: GC-17
  title: 工程师发现隐患不上报
  category: 职业失真
  kind: detector
  input: "他发现 3 号墩有严重裂缝，但没有上报，因为怕麻烦。"
  expect:
    verdict: FAIL
    failure_type: CHARACTER_VALUE_HIERARCHY_COLLAPSE
  note: 违反工程伦理（若 constitution 中责任/安全为最高价值）。

- id: GC-18
  title: 律师程序性场合行为失范
  category: 职业失真
  kind: detector
  input: "在法庭上，他直接抢过证人证词撕掉了。"
  expect:
    verdict: FAIL
    failure_type: WCI
  note: 职业行为与制度冲突且无代价呈现。

- id: GC-19
  title: 职业细节真实且参与叙事
  category: 职业失真
  kind: generator
  input: "梅雨导致铁路限速，排水工程师连夜值守"
  expect:
    verdict: PASS
    failure_type: null
  note: 主题×人物×职业×世界的独特交叉（正例）。

# ============ 五、价值观崩塌（4） ============

- id: GC-20
  title: 最高价值人物无过程反转
  category: 价值观崩塌
  kind: detector
  input: "他守了一辈子桥，一夜之间决定炸掉它。"
  expect:
    verdict: FAIL
    failure_type: VALUE_FLIP_WITHOUT_PROCESS
  note: 价值翻转无多场景铺垫（状态机 S0→S4 跳跃）。

- id: GC-21
  title: 行为违反最高价值且无冲突剧情
  category: 价值观崩塌
  kind: detector
  input: "他知道桥有隐患，却让车队通过。"
  expect:
    verdict: FAIL
    failure_type: CHARACTER_VALUE_HIERARCHY_COLLAPSE
  note: 违反最高价值（公共安全）且无冲突代价呈现。

- id: GC-22
  title: 假两难（其实没冲突硬拗纠结）
  category: 价值观崩塌
  kind: detector
  input: "他纠结了很久：选 A 还是选 A（其实 A 明显正确）。"
  expect:
    verdict: WARN
    failure_type: FALSE_DILEMMA
  note: 两难必须来自真实价值冲突（权重差 <0.2）。

- id: GC-23
  title: 价值权重渐变 + 铺垫充分
  category: 价值观崩塌
  kind: generator
  input: "从守桥到放下的渐变弧线"
  expect:
    verdict: PASS
    failure_type: null
  note: 正例：多场景铺垫的价值变化。

