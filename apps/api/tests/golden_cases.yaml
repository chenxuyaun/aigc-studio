# ============ 十、因果/时间线/记忆/世界规则（6） ============

- id: GC-41
  title: A→D 因果跳跃（无中间环节）
  category: 因果断裂
  kind: detector
  input: "他打了个电话，第二天公司就倒闭了。"
  expect:
    verdict: FAIL
    failure_type: CAUSAL_LEAP
  note: 缺 B、C 及必然性。

- id: GC-42
  title: 时间线矛盾
  category: 时间线
  kind: detector
  input: "第一章说昨天发生的事，第三章说上周发生的同一件事。"
  expect:
    verdict: FAIL
    failure_type: TIMELINE_CONFLICT
  note: 时间引用自洽性。

- id: GC-43
  title: 人物记忆错误
  category: 人物记忆
  kind: detector
  input: "他忘记了自己亲笔签过的验收报告。"
  expect:
    verdict: FAIL
    failure_type: MEMORY_ERROR
  note: 事实记忆一致性（StoryState.facts 对照）。

- id: GC-44
  title: 世界规则破坏
  category: 世界规则
  kind: detector
  input: "设定里魔法只能白天使用，他却半夜施法成功。"
  expect:
    verdict: FAIL
    failure_type: WCI
  note: IMMUTABLE 世界规则被破坏。

- id: GC-45
  title: 伏笔未回收（open loop 超 N 章）
  category: 伏笔
  kind: detector
  input: "第 2 章埋的'神秘来信'，到第 30 章也没再提。"
  expect:
    verdict: WARN
    failure_type: LOOP_LEAK
  note: open_loops 超阈值未回收。

- id: GC-46
  title: 知识泄漏（不该知道的人知道）
  category: 世界规则
  kind: detector
  input: "第 3 章刚发生的秘密，第 1 章就有人知道。"
  expect:
    verdict: FAIL
    failure_type: KNOWLEDGE_LEAK
  note: knowledge_state 与 timeline 对齐。

