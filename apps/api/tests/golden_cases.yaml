# Golden Cases：创作质量回归基准（docs/creative-engine/09）
#
# 每次修改 Prompt / Agent / 模型路由 / 质量门后自动回归。
# 结构：id / title / category / kind / input / expect / note
#   kind: generator（给生成器：期望产出质量）| detector（给检查器：期望检测命中）
#   expect: PASS / FAIL / WARN + failure_type（detector 类）
# 判定：确定性检查器纯函数断言；LLM 检查器用 Golden Case 期望区间（runner 实现）。

# ============ 一、人物降维（5） ============

- id: GC-01
  title: 守桥人降维成亡妻丈夫（桥的名字·典型错误）
  category: 人物降维
  kind: detector
  input: "通车那天他没去剪彩，因为想起亡妻。"
  expect:
    verdict: FAIL
    failure_type: CHARACTER_VALUE_HIERARCHY_COLLAPSE
  note: 行为仅由情绪触发器驱动，职业价值（责任/工程伦理）完全缺席。等价 REGRESSION_CASE_001 scenario_a。

- id: GC-02
  title: 法医重大决定只用"想起女儿"解释
  category: 人物降维
  kind: detector
  input: "他决定隐瞒尸检报告的异常，因为想起女儿的话。"
  expect:
    verdict: FAIL
    failure_type: MOTIVATION_DOWNGRADE
  note: 专业身份（法医）与职业伦理未参与重大决定。

- id: GC-03
  title: 工程师一切行为动机 = 初恋
  category: 人物降维
  kind: detector
  input: "他推翻了加固方案，因为那是初恋提过的设计。"
  expect:
    verdict: FAIL
    failure_type: MOTIVATION_DOWNGRADE
  note: 重大工程决策由低层情感驱动，价值层级缺席。

- id: GC-04
  title: 无职业/价值参与的可替换主角
  category: 人物降维
  kind: detector
  input: "他决定离开，因为剧情需要他去远方。"
  expect:
    verdict: FAIL
    failure_type: GENERIC_CHARACTER
  note: 换成任何职业/身份都成立的木偶行为。

- id: GC-05
  title: 替换关系对象故事完全不变
  category: 人物降维
  kind: detector
  input: "妻子、父亲、战友、老师——换成谁都一样，故事没有任何变化。"
  expect:
    verdict: FAIL
    failure_type: GENERIC_CHARACTER
  note: 反事实 Test E 失败：关系未进入人物模型。

# ============ 二、情绪套路（6） ============

- id: GC-06
  title: 「妻子死了→他一生等待」无价值参与
  category: 情绪套路
  kind: detector
  input: "妻子死后，他等了十年，再也没有娶妻。"
  expect:
    verdict: WARN
    failure_type: EMOTIONAL_SHORTCUT_WARNING
  note: 等待作为深刻替代品，人物价值/使命缺席。

- id: GC-07
  title: 悲情四件套（雨+旧照片+遗物+十年）
  category: 情绪套路
  kind: detector
  input: "雨下了十年，他守着旧照片和妻子的遗物，在故乡的老屋里等待。"
  expect:
    verdict: WARN
    failure_type: EMOTIONAL_SHORTCUT_WARNING
  note: 套路组合拳（cluster ≥3），人物维度词极少。

- id: GC-08
  title: 套路元素只渲染不参与叙事
  category: 情绪套路
  kind: detector
  input: "他走过桥，看见月下的背影，又想起那个雨夜。"
  expect:
    verdict: WARN
    failure_type: EMOTIONAL_SHORTCUT_WARNING
  note: 渲染 > 参与：元素出现但未与人物价值/历史绑定。

- id: GC-09
  title: 「背影消失在雨里」当深刻收尾
  category: 情绪套路
  kind: detector
  input: "她转身走进雨里，背影渐渐消失。这就是他的一生。"
  expect:
    verdict: WARN
    failure_type: EMOTIONAL_SHORTCUT_WARNING
  note: 意象收尾替代人物弧线交代。

- id: GC-10
  title: 套路元素与人物历史真正相关
  category: 情绪套路
  kind: detector
  input: "雨落在桥墩上，他想起自己守桥三十年的第一个雨季，在责任书上签了字。"
  expect:
    verdict: PASS
    failure_type: null
  note: 不误杀：元素与价值/职业绑定，depth 信号在场。

- id: GC-11
  title: 随机死亡（无因果铺垫）
  category: 情绪套路
  kind: detector
  input: "他走出工地，被一辆失控的卡车撞倒，故事结束。"
  expect:
    verdict: FAIL
    failure_type: FORCED_DEATH
  note: 死亡为悲剧而悲剧，无价值冲突/环境必然性。

