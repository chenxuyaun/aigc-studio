resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # api 容器重建后 IP 会变：用变量 + resolver 动态解析，避免 keepalive 指向旧 IP 导致 502
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 正确健康路径在 /api/v1/health/* 与 /healthz；保留兼容别名
    location = /health {
        proxy_pass http://api:8000/api/v1/health/live;
    }

    location = /health/live {
        proxy_pass http://api:8000/api/v1/health/live;
    }

    location = /health/ready {
        proxy_pass http://api:8000/api/v1/health/ready;
    }

    location /healthz {
        proxy_pass http://api:8000/healthz;
    }

    # 私有媒体不允许 nginx 直出（会绕过应用层鉴权，且 public immutable 长缓存泄露隐私）。
    # 统一走 /api/v1/assets/{id}/content（应用内做归属校验 + 预签名）。
    # 如需本地调试直出，请显式加 allow/deny 或临时打开，禁止上线。
    # location /storage/ {
    #     alias /app/storage/;
    #     deny all;
    # }

    # HTML 入口禁止缓存：SPA 部署后用户必须立即拿到新 index.html（新 hash 资源）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # location 内 add_header 不继承 server 级，这里单独补 CSP
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; media-src 'self' http: https:; connect-src 'self' http: https: ws: wss:; font-src 'self' data:; frame-ancestors 'self';" always;
    }

    # PWA Service Worker 必须可更新（否则旧 SW 永远拦截，部署后用户滞留旧版）
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /remoteEntry.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    # CSP：script 仅同源（Vite 构建无内联脚本）；style 允许内联（样式库注入）；
    # connect/img/media 放开 http(s)/ws 以兼容外部图片与 SSE 流
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; media-src 'self' http: https:; connect-src 'self' http: https: ws: wss:; font-src 'self' data:; frame-ancestors 'self';" always;
}
